services:
  - type: web
    name: lets-connect-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false  # Set this manually in Render dashboard to your Vercel frontend URL
      - key: MONGODB_URI
        sync: false  # Set this manually in Render dashboard to your MongoDB connection string
